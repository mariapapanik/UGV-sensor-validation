# robot_localization EKF: wheel encoders + IMU -> /odometry/filtered
#
# Skid-steer strategy: take linear velocity from the encoders (reliable)
# and heading + yaw rate from the IMU (the encoders overestimate turns).
#
# *_config order: [x, y, z, roll, pitch, yaw,
#                  vx, vy, vz, vroll, vpitch, vyaw,
#                  ax, ay, az]
ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    two_d_mode: true
    # DiffDrive already publishes odom -> base_footprint on /tf
    publish_tf: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Encoder odometry (Gazebo DiffDrive): forward speed, plus vy = 0 (it can't slide sideways)
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false

    # IMU: heading and yaw rate
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true
